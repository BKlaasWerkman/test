<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LCD Snake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
  /* One deliberate look: a monochrome phone LCD set in a dark olive handset. */
  :root {
    color-scheme: dark;
    --case: #262d22;
    --case-edge: #3a4433;
    --lcd: #c5d6a8;
    --lcd-shade: #b9cb9b;
    --pixel: #2c3822;
    --pixel-soft: #5d6e4a;
    --label: #dfe6cf;
    --muted: #8f9c7d;
    --key: #4b5842;
    --key-edge: #1c2218;
    --font: "VT323", ui-monospace, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding-inline: 16px;
    padding-block: 16px;
    background: var(--case);
    color: var(--label);
    font-family: var(--font);
    font-size: 20px;
  }
  h1 {
    margin: 0;
    font-size: 2.4rem;
    font-weight: 400;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    text-wrap: balance;
  }
  .board {
    position: relative;
    width: min(480px, 100%);
    max-width: 100%;
    padding: 14px;
    border-radius: 18px;
    background: var(--case-edge);
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.06), 0 10px 30px rgba(0, 0, 0, 0.35);
  }
  .screen {
    position: relative;
    border-radius: 6px;
    overflow: hidden;
    background: var(--lcd);
    box-shadow: inset 0 0 18px rgba(44, 56, 34, 0.35);
  }
  .hud {
    display: flex;
    justify-content: space-between;
    padding: 4px 12px;
    color: var(--pixel);
    font-size: 1.3rem;
    font-variant-numeric: tabular-nums;
    border-bottom: 2px solid var(--pixel-soft);
  }
  canvas {
    width: 100%;
    max-width: 100%;
    aspect-ratio: 1;
    display: block;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px;
    text-align: center;
    color: var(--pixel);
    background: color-mix(in srgb, var(--lcd) 88%, transparent);
    z-index: 2;
  }
  .overlay[hidden] { display: none; }
  .overlay h2 { margin: 0; font-size: 2.6rem; font-weight: 400; letter-spacing: 0.08em; }
  .overlay p { margin: 0; font-size: 1.3rem; max-width: 26ch; }
  button {
    font: inherit;
    font-size: 1.4rem;
    letter-spacing: 0.08em;
    padding: 6px 22px;
    border: 0;
    border-radius: 999px;
    background: var(--key);
    color: var(--label);
    box-shadow: 0 3px 0 var(--key-edge);
    cursor: pointer;
  }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--key-edge); }
  button:focus-visible { outline: 2px dashed var(--pixel); outline-offset: 4px; }
  .help { margin: 0; color: var(--muted); font-size: 1.15rem; text-align: center; }
</style>
</head>
<body>
  <h1>Snake</h1>
  <div class="board">
    <div class="screen">
      <div class="hud">
        <span>SCORE <strong id="score">0</strong></span>
        <span>BEST <strong id="best">0</strong></span>
      </div>
      <canvas id="game" width="480" height="480"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="overlay-title">SNAKE</h2>
        <p id="overlay-text">Eat the food. Don't hit the walls or your own tail.</p>
        <button id="start">Start</button>
      </div>
    </div>
  </div>
  <p class="help">Arrows or WASD to steer · Space to pause · Swipe on a phone</p>

<script>
(() => {
  const GRID = 20;
  const CELL = 480 / GRID;
  const START_SPEED = 130; // ms per tick
  const MIN_SPEED = 60;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayText = document.getElementById('overlay-text');
  const startBtn = document.getElementById('start');

  const DIRS = {
    up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
    left: { x: -1, y: 0 }, right: { x: 1, y: 0 },
  };
  const KEYS = {
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  };

  let snake, dir, queue, food, score, speed, timer, state = 'idle';
  let best = 0;
  try { best = Number(localStorage.getItem('snake-best')) || 0; } catch {}
  bestEl.textContent = best;

  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  function reset() {
    const mid = Math.floor(GRID / 2);
    snake = [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }];
    dir = DIRS.right;
    queue = [];
    score = 0;
    speed = START_SPEED;
    scoreEl.textContent = 0;
    placeFood();
  }

  function placeFood() {
    const free = [];
    for (let y = 0; y < GRID; y++)
      for (let x = 0; x < GRID; x++)
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
    food = free[Math.floor(Math.random() * free.length)];
  }

  function turn(name) {
    const next = DIRS[name];
    const last = queue.length ? queue[queue.length - 1] : dir;
    // Ignore reversals and repeats; buffer up to 2 turns so quick inputs aren't lost.
    if (next.x === -last.x && next.y === -last.y) return;
    if (next === last || queue.length >= 2) return;
    queue.push(next);
  }

  function tick() {
    if (queue.length) dir = queue.shift();
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const eating = food && head.x === food.x && head.y === food.y;
    // The tail moves out of the way this tick unless we're growing.
    const body = eating ? snake : snake.slice(0, -1);

    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
        body.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);
    if (eating) {
      score++;
      scoreEl.textContent = score;
      speed = Math.max(MIN_SPEED, speed - 3);
      if (snake.length === GRID * GRID) return gameOver(true);
      placeFood();
    } else {
      snake.pop();
    }
    draw();
    timer = setTimeout(tick, speed);
  }

  function draw() {
    const lcd = css('--lcd'), ghost = css('--lcd-shade'), ink = css('--pixel');
    ctx.fillStyle = lcd;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Unlit LCD cells, so the grid reads like a real segment display.
    ctx.fillStyle = ghost;
    for (let y = 0; y < GRID; y++)
      for (let x = 0; x < GRID; x++)
        ctx.fillRect(x * CELL + 2, y * CELL + 2, CELL - 4, CELL - 4);

    if (food) {
      const cx = food.x * CELL + CELL / 2, cy = food.y * CELL + CELL / 2, r = CELL * 0.36;
      ctx.fillStyle = ink;
      ctx.beginPath();
      ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy); ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r, cy);
      ctx.fill();
    }

    snake.forEach((s, i) => {
      ctx.fillStyle = ink;
      ctx.fillRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4);
      if (i === 0) {
        // Two eyes, facing the direction of travel.
        ctx.fillStyle = lcd;
        const cx = s.x * CELL + CELL / 2 + dir.x * CELL * 0.18;
        const cy = s.y * CELL + CELL / 2 + dir.y * CELL * 0.18;
        const ox = dir.y * CELL * 0.2, oy = dir.x * CELL * 0.2, e = 3;
        ctx.fillRect(cx + ox - e / 2, cy + oy - e / 2, e, e);
        ctx.fillRect(cx - ox - e / 2, cy - oy - e / 2, e, e);
      }
    });
  }

  function start() {
    reset();
    draw();
    state = 'running';
    overlay.hidden = true;
    clearTimeout(timer);
    timer = setTimeout(tick, speed);
  }

  function togglePause() {
    if (state === 'running') {
      state = 'paused';
      clearTimeout(timer);
      showOverlay('Paused', 'Press Space or Resume to continue.', 'Resume');
    } else if (state === 'paused') {
      state = 'running';
      overlay.hidden = true;
      timer = setTimeout(tick, speed);
    }
  }

  function gameOver(won = false) {
    state = 'over';
    clearTimeout(timer);
    draw();
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('snake-best', best); } catch {}
    }
    showOverlay(won ? 'You win!' : 'Game over', `Score: ${score}`, 'Play again');
  }

  function showOverlay(title, text, label) {
    overlayTitle.textContent = title;
    overlayText.textContent = text;
    startBtn.textContent = label;
    overlay.hidden = false;
    startBtn.focus();
  }

  startBtn.addEventListener('click', () => state === 'paused' ? togglePause() : start());

  document.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      e.preventDefault();
      if (state === 'running' || state === 'paused') togglePause();
      else start();
      return;
    }
    const name = KEYS[e.code];
    if (!name) return;
    e.preventDefault();
    if (state === 'idle' || state === 'over') start();
    if (state === 'running') turn(name);
  });

  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!touchStart || state !== 'running') return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });

  reset();
  draw();
})();
</script>
</body>
</html>
